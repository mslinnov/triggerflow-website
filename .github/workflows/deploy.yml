name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GA_CONSENT_MODE: ${{ vars.NEXT_PUBLIC_GA_CONSENT_MODE }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 12m
          # Forward the analytics env vars into the remote shell so the build
          # bakes them in regardless of any .env file present on the VPS.
          envs: NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_GA_CONSENT_MODE,NEXT_PUBLIC_META_PIXEL_ID
          script: |
            set -euo pipefail
            cd /var/www/triggerflow-website

            echo "::group::Git update"
            git fetch --prune origin main
            git reset --hard origin/main
            git log -1 --oneline
            echo "::endgroup::"

            echo "::group::Install dependencies"
            npm ci --no-audit --no-fund
            echo "::endgroup::"

            echo "::group::Build"
            if [ -z "${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}" ]; then
              echo "::warning::NEXT_PUBLIC_GA_MEASUREMENT_ID is empty — analytics will NOT be tracked in this build. Set the GitHub secret."
            fi
            if [ -z "${NEXT_PUBLIC_META_PIXEL_ID:-}" ]; then
              echo "::warning::NEXT_PUBLIC_META_PIXEL_ID is empty — the Meta pixel will NOT load in this build. Set the GitHub variable."
            fi
            NODE_ENV=production npm run build
            echo "::endgroup::"

            echo "::group::Reload PM2"
            pm2 reload triggerflow-website --update-env
            pm2 save
            echo "::endgroup::"

            echo "::group::Health check"
            sleep 3
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L http://127.0.0.1:3002/fr)
            echo "Homepage /fr returned HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Health check failed (expected 200, got $HTTP_CODE)"
              exit 1
            fi
            echo "::endgroup::"

            echo "Deployment complete."
