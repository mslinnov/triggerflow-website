name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd /var/www/triggerflow-website

            echo "::group::Git update"
            git fetch --prune origin main
            git reset --hard origin/main
            git log -1 --oneline
            echo "::endgroup::"

            echo "::group::Install dependencies"
            npm ci --no-audit --no-fund
            echo "::endgroup::"

            echo "::group::Build"
            NODE_ENV=production npm run build
            echo "::endgroup::"

            echo "::group::Reload PM2"
            pm2 reload triggerflow-website --update-env
            pm2 save
            echo "::endgroup::"

            echo "::group::Health check"
            sleep 3
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L http://127.0.0.1:3002/fr)
            echo "Homepage /fr returned HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Health check failed (expected 200, got $HTTP_CODE)"
              exit 1
            fi
            echo "::endgroup::"

            echo "Deployment complete."
