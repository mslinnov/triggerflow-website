name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GA_CONSENT_MODE: ${{ vars.NEXT_PUBLIC_GA_CONSENT_MODE }}
          # L'ID est stocké en secret sur ce dépôt, pas en variable : lire
          # uniquement `vars` renvoyait une chaîne vide et le pixel ne se
          # chargeait jamais. On accepte les deux emplacements.
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID || vars.NEXT_PUBLIC_META_PIXEL_ID }}
          # Collecte des leads des landing pages d'acquisition (/api/leads).
          # Variables d'exécution, pas de build : elles sont injectées dans le
          # process via `pm2 reload --update-env` plus bas.
          # Clé API Brevo. Absente du serveur jusqu'ici, ce qui faisait échouer
          # silencieusement la newsletter comme la collecte des leads.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_LEADS_LIST_ID: ${{ secrets.BREVO_LEADS_LIST_ID }}
          LEADS_NOTIFICATION_EMAIL: ${{ secrets.LEADS_NOTIFICATION_EMAIL }}
          # Relais des livres blancs vers l'API TriggerFlow (/api/leads).
          # Sans ces deux variables, le lead est bien enregistre dans Brevo
          # mais aucun guide n'est envoye et aucune sequence ne demarre.
          TRIGGERFLOW_API_URL: ${{ secrets.TRIGGERFLOW_API_URL || vars.TRIGGERFLOW_API_URL }}
          LEAD_MAGNET_SECRET: ${{ secrets.LEAD_MAGNET_SECRET }}
          # Comptage des ouvertures des documents commerciaux partages
          # (/doc/<document>/<suffixe>). Sans ce secret, la page est servie
          # normalement mais AUCUNE ouverture n'est comptee, en silence.
          DOCUMENT_VIEW_SECRET: ${{ secrets.DOCUMENT_VIEW_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 12m
          # Forward the analytics env vars into the remote shell so the build
          # bakes them in regardless of any .env file present on the VPS.
          envs: NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_GA_CONSENT_MODE,NEXT_PUBLIC_META_PIXEL_ID,BREVO_API_KEY,BREVO_LIST_ID,BREVO_LEADS_LIST_ID,LEADS_NOTIFICATION_EMAIL,TRIGGERFLOW_API_URL,LEAD_MAGNET_SECRET,DOCUMENT_VIEW_SECRET
          script: |
            set -euo pipefail
            cd /var/www/triggerflow-website

            echo "::group::Git update"
            git fetch --prune origin main
            git reset --hard origin/main
            git log -1 --oneline
            echo "::endgroup::"

            echo "::group::Install dependencies"
            npm ci --no-audit --no-fund
            echo "::endgroup::"

            echo "::group::Configuration d'execution"
            # `pm2 reload --update-env` s'est revele peu fiable pour propager
            # ces variables jusqu'au process Next.js. On les ecrit donc dans
            # .env.production.local, que Next lit en priorite au demarrage, en
            # remplacant proprement d'eventuelles lignes precedentes.
            ENV_FILE=.env.production.local
            touch "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            grep -v -E '^(BREVO_API_KEY|BREVO_LIST_ID|BREVO_LEADS_LIST_ID|LEADS_NOTIFICATION_EMAIL|TRIGGERFLOW_API_URL|LEAD_MAGNET_SECRET|DOCUMENT_VIEW_SECRET)=' "$ENV_FILE" > "$ENV_FILE.tmp" || true
            mv "$ENV_FILE.tmp" "$ENV_FILE"
            # Une variable non fournie n'est pas ecrite, pour ne pas ecraser une
            # valeur deja presente ailleurs par une chaine vide.
            [ -n "${BREVO_API_KEY:-}" ] && printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY" >> "$ENV_FILE"
            [ -n "${BREVO_LIST_ID:-}" ] && printf 'BREVO_LIST_ID=%s\n' "$BREVO_LIST_ID" >> "$ENV_FILE"
            [ -n "${BREVO_LEADS_LIST_ID:-}" ] && printf 'BREVO_LEADS_LIST_ID=%s\n' "$BREVO_LEADS_LIST_ID" >> "$ENV_FILE"
            [ -n "${LEADS_NOTIFICATION_EMAIL:-}" ] && printf 'LEADS_NOTIFICATION_EMAIL=%s\n' "$LEADS_NOTIFICATION_EMAIL" >> "$ENV_FILE"
            [ -n "${TRIGGERFLOW_API_URL:-}" ] && printf 'TRIGGERFLOW_API_URL=%s\n' "$TRIGGERFLOW_API_URL" >> "$ENV_FILE"
            [ -n "${LEAD_MAGNET_SECRET:-}" ] && printf 'LEAD_MAGNET_SECRET=%s\n' "$LEAD_MAGNET_SECRET" >> "$ENV_FILE"
            [ -n "${DOCUMENT_VIEW_SECRET:-}" ] && printf 'DOCUMENT_VIEW_SECRET=%s\n' "$DOCUMENT_VIEW_SECRET" >> "$ENV_FILE"
            true
            chmod 600 "$ENV_FILE"

            # Diagnostic : presence uniquement, jamais les valeurs.
            echo "Fichiers d'environnement presents :"
            ls -1 .env* 2>/dev/null || echo "  aucun"
            for key in BREVO_API_KEY BREVO_LEADS_LIST_ID LEADS_NOTIFICATION_EMAIL TRIGGERFLOW_API_URL LEAD_MAGNET_SECRET DOCUMENT_VIEW_SECRET; do
              if grep -qE "^${key}=." .env* 2>/dev/null; then
                echo "  ${key}: present dans un fichier .env"
              else
                echo "  ${key}: ABSENT des fichiers .env"
              fi
            done
            echo "::endgroup::"

            echo "::group::Build"
            if [ -z "${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}" ]; then
              echo "::warning::NEXT_PUBLIC_GA_MEASUREMENT_ID is empty — analytics will NOT be tracked in this build. Set the GitHub secret."
            fi
            if [ -z "${NEXT_PUBLIC_META_PIXEL_ID:-}" ]; then
              echo "::warning::NEXT_PUBLIC_META_PIXEL_ID is empty — the Meta pixel will NOT load in this build. Set the GitHub secret or variable."
            fi
            NODE_ENV=production npm run build
            echo "::endgroup::"

            echo "::group::Reload PM2"
            if [ -z "${BREVO_LEADS_LIST_ID:-}" ]; then
              echo "::warning::BREVO_LEADS_LIST_ID is empty — landing page leads will be logged and DISCARDED, not saved to Brevo. Set the GitHub secret before running ads."
            fi
            if [ -z "${LEAD_MAGNET_SECRET:-}" ]; then
              echo "::warning::LEAD_MAGNET_SECRET is empty: white paper leads will be saved to Brevo but NO guide will be sent and NO follow-up sequence will start. Set the GitHub secret before running ads."
            fi
            if [ -z "${DOCUMENT_VIEW_SECRET:-}" ]; then
              echo "::warning::DOCUMENT_VIEW_SECRET is empty: shared documents under /doc/ will still be served, but NO opening will be counted. Set the GitHub secret, and the same value on the TriggerFlow backend."
            fi
            # Ceinture et bretelles : le fichier .env.production.local ci-dessus
            # est le mecanisme principal, l'environnement du shell le complete.
            export BREVO_LEADS_LIST_ID LEADS_NOTIFICATION_EMAIL TRIGGERFLOW_API_URL LEAD_MAGNET_SECRET DOCUMENT_VIEW_SECRET
            pm2 reload triggerflow-website --update-env
            pm2 save
            echo "::endgroup::"

            echo "::group::Health check"
            sleep 3
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L http://127.0.0.1:3002/fr)
            echo "Homepage /fr returned HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Health check failed (expected 200, got $HTTP_CODE)"
              exit 1
            fi
            echo "::endgroup::"

            echo "Deployment complete."
