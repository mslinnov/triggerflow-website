<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Formation stand Equip'Hôtel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23006F68%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EJ0%3C/text%3E%3C/svg%3E">
<meta name="description" content="Formation mobile pour l'équipe du stand Equip'Hôtel : le séjour d'une cliente, la démo, les profils de visiteurs, les questions fréquentes, l'offre salon, des mises en situation et un quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Mise en page : une mini-appli en écrans courts. En-tête collant (sommaire, progression, frise des jours),
   contenu au milieu, barre d'action fixée en bas sous le pouce. Signature : la frise graduée en jours J-30 à J+3. */
:root {
  --paper: #F3F6F5;
  --surface: #FFFFFF;
  --ink: #132624;
  --muted: #536461;
  --line: #D7E0DD;
  --brand: #006F68;
  --brand-ink: #005A54;
  --brand-soft: #DCEDEA;
  --on-brand: #FFFFFF;
  --brass: #9A6A22;
  --brass-soft: #F5EAD7;
  --ok: #1D7845;
  --ok-soft: #E2F3E8;
  --ko: #B3261E;
  --ko-soft: #FBE8E6;
  --scrim: rgba(10, 22, 21, .45);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
  --bar-h: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1514; --surface: #16201F; --ink: #E4EDEB; --muted: #9AABA7; --line: #283634;
    --brand: #4FC2B8; --brand-ink: #86DCD3; --brand-soft: #12312E; --on-brand: #06201E;
    --brass: #E2B46C; --brass-soft: #30261A; --ok: #6FD39A; --ok-soft: #15301F; --ko: #FF8A80; --ko-soft: #3A1C1A;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1514; --surface: #16201F; --ink: #E4EDEB; --muted: #9AABA7; --line: #283634;
  --brand: #4FC2B8; --brand-ink: #86DCD3; --brand-soft: #12312E; --on-brand: #06201E;
  --brass: #E2B46C; --brass-soft: #30261A; --ok: #6FD39A; --ok-soft: #15301F; --ko: #FF8A80; --ko-soft: #3A1C1A;
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.55 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* En-tête */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 6px 12px; display: grid; gap: 8px; }
.top-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.home-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 8px 4px; margin-left: -4px; min-height: 44px; color: var(--brand-ink); font-weight: 700; font-size: 15px; cursor: pointer; }
.top-title { flex: 1; min-width: 0; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .35s ease; }

/* Frise des jours (signature) */
.ruler { position: relative; padding-top: 24px; }
.ruler-track { position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 32px; height: 2px; background: var(--line); }
.ruler-break { position: absolute; top: 24px; left: calc(100% / 6); transform: translateX(-50%); font-family: var(--font-mono); font-size: 12px; color: var(--muted); background: var(--paper); padding-inline: 3px; line-height: 16px; }
.ruler-ticks { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); list-style: none; margin: 0; padding: 0; }
.ruler-ticks li { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ruler-ticks .tick { width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); margin-top: 3px; }
.ruler-ticks li.done .tick { background: var(--brand); border-color: var(--brand); }
.ruler-ticks .d { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1; }
.ruler-ticks li.here .d { color: var(--brand-ink); }
.ruler-pin {
  position: absolute; top: 0; left: calc((var(--i, 0) + .5) * 100% / 6);
  transform: translateX(-50%);
  transition: left .45s cubic-bezier(.3, .7, .2, 1);
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .02em;
  background: var(--brand); color: var(--on-brand); padding: 2px 7px; border-radius: 6px; white-space: nowrap;
}
.ruler-pin::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-bottom: 0; border-top-color: var(--brand); }
.ruler-pin.first { transform: translateX(-20%); }
.ruler-pin.first::after { left: 20%; }
.ruler-pin.last { transform: translateX(-80%); }
.ruler-pin.last::after { left: 80%; }

/* Contenu */
main { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 20px calc(var(--bar-h) + 32px + env(safe-area-inset-bottom, 0px)); }
.screen { display: grid; gap: 22px; animation: rise .3s ease both; }
@keyframes rise { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-ink); }
h1, h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 8.5vw, 40px); line-height: 1.05; }
h2 { font-size: 26px; line-height: 1.12; }
.lead { margin: 0; color: var(--muted); font-size: 17px; }
.stack { display: grid; gap: 10px; }
.label { margin: 0; font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.prose p { margin: 0 0 10px; }
.prose p:last-child { margin: 0; }

/* Accueil */
.hero { display: grid; gap: 14px; padding-top: 6px; }
.hero .ruler { margin-top: 6px; }
.modules { display: grid; gap: 12px; }
.module {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  text-align: left; width: 100%; padding: 16px; min-height: 76px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer;
}
.module .num { font-family: var(--font-display); font-weight: 800; font-size: 28px; color: var(--brand); width: 28px; text-align: center; }
.module b { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.2; }
.module small { display: block; margin-top: 3px; color: var(--muted); font-size: 14.5px; }
.status { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 99px; background: var(--paper); color: var(--muted); white-space: nowrap; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.wip { background: var(--brand-soft); color: var(--brand-ink); }
.lex-link { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; min-height: 56px; border: 1px dashed var(--line); background: transparent; border-radius: var(--radius); cursor: pointer; text-align: left; }
.lex-link span { flex: 1; }
.note { font-size: 14.5px; color: var(--muted); margin: 0; }
.tag-option { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; background: var(--brass-soft); color: var(--brass); padding: 2px 7px; border-radius: 6px; vertical-align: 2px; }

/* Étape */
.duo { display: grid; gap: 14px; }
.side { display: grid; gap: 8px; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.side.team { background: transparent; border-style: dashed; }
.autos { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.auto { padding: 14px 16px; display: grid; gap: 6px; }
.auto + .auto { border-top: 1px solid var(--line); }
.auto .ben { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.25; }
.auto .what { color: var(--muted); font-size: 15.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 12.5px; padding: 4px 8px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); color: var(--ink); }
.chip .icon { width: 14px; height: 14px; }
.chip.when { background: var(--brand-soft); border-color: transparent; color: var(--brand-ink); font-weight: 600; }
.say { position: relative; padding: 18px 18px 18px 52px; border-radius: var(--radius); background: var(--brass-soft); }
.say::before { content: "“"; position: absolute; left: 14px; top: 2px; font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; color: var(--brass); }
.say .label { color: var(--brass); margin-bottom: 6px; }
.say q { quotes: none; font-size: 18px; font-style: italic; line-height: 1.45; }

/* Termes et panneau de définition */
.term { border: 0; background: none; padding: 0; cursor: pointer; color: var(--brand-ink); font-weight: 700; text-decoration: underline dotted 2px; text-underline-offset: 4px; }
.prose .term, .auto .term { display: inline; }
.term-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.term-chips .term { text-decoration: none; padding: 8px 12px; min-height: 40px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
.sheet-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .2s ease both; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  max-width: 640px; margin: 0 auto;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .2);
  animation: up .25s cubic-bezier(.3, .7, .2, 1) both;
}
.sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { font-family: var(--font-display); font-size: 24px; margin: 0 0 8px; }
.sheet p { margin: 0 0 18px; font-size: 17px; }
.sheet .btn { width: 100%; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Questions */
.question { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.25; margin: 0; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
  width: 100%; text-align: left; padding: 14px; min-height: 56px; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); font-size: 16.5px; line-height: 1.4;
}
.opt .letter { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 600; background: var(--paper); color: var(--muted); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.good { border-color: var(--ok); background: var(--ok-soft); }
.opt.good .letter { background: var(--ok); color: var(--surface); }
.opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.opt.bad .letter { background: var(--ko); color: var(--surface); }
.opt.faded { opacity: .55; }
.feedback { padding: 14px 16px; border-radius: var(--radius); font-size: 16px; }
.feedback b { display: block; font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.ok b { color: var(--ok); }
.feedback.ko { background: var(--ko-soft); }
.feedback.ko b { color: var(--ko); }

/* Mises en situation : conversation */
.convo { display: grid; gap: 10px; }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-ink); font-family: var(--font-display); font-weight: 800; font-size: 15px; flex: none; }
.who small { display: block; color: var(--muted); font-size: 14px; line-height: 1.3; }
.who b { display: block; font-size: 16px; line-height: 1.3; }
.bubble { justify-self: start; max-width: 92%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; font-size: 18px; }
.context { margin: 0; font-size: 15px; color: var(--muted); font-style: italic; }

/* Résultats */
.result { display: grid; gap: 10px; justify-items: start; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.big { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; color: var(--brand); font-variant-numeric: tabular-nums; }
.big small { font-size: 24px; color: var(--muted); }
.review { display: grid; gap: 4px; }
.review .btn { text-align: left; font-weight: 600; }

/* Lexique */
.search { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.lex { display: grid; gap: 8px; }
.lex details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.lex summary { list-style: none; cursor: pointer; padding: 14px 16px; min-height: 52px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; }
.lex summary::-webkit-details-marker { display: none; }
.lex summary::after { content: "+"; font-family: var(--font-mono); font-size: 20px; color: var(--brand); }
.lex details[open] summary::after { content: "−"; }
.lex details p { margin: 0; padding: 0 16px 14px; }
.empty { color: var(--muted); margin: 0; }

/* Barre d'action */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: 640px; margin: 0 auto; padding-inline: 16px; display: flex; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16.5px; cursor: pointer; }
.btn.primary { flex: 1; min-width: 0; background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.primary:disabled { opacity: .45; cursor: default; }

/* Fiches du salon */
.profil .tag { display: inline-block; margin-top: 3px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--brand-ink); }
.facts { margin: 4px 0 0; display: grid; gap: 4px; }
.facts dt { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.facts dd { margin: 0; }
.steps-list { margin: 0; padding: 0; list-style: none; counter-reset: q; display: grid; gap: 8px; }
.steps-list li { counter-increment: q; display: flex; gap: 12px; align-items: baseline; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 17px; }
.steps-list li::before { content: counter(q); font-family: var(--font-display); font-weight: 800; color: var(--brand); min-width: 16px; }
.prices { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.price-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.price-row + .price-row { border-top: 1px solid var(--line); }
.price-row b { display: block; font-family: var(--font-display); font-size: 18px; }
.price-row small { display: block; color: var(--muted); font-size: 14px; }
.num-col { display: grid; justify-items: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.num-col .was { color: var(--muted); text-decoration: line-through; font-size: 14px; }
.num-col .now { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--brand-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--brand-ink); padding: 0 4px; justify-content: flex-start; min-height: 44px; }
.btn.square { width: 52px; padding: 0; flex: none; }

@media (min-width: 700px) {
  .duo { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top" id="top" hidden></header>
<main id="main"></main>
<nav class="bar" aria-label="Actions"><div class="bar-inner" id="bar"></div></nav>
<div id="sheet-root"></div>

<script>
(function () {

  function icon(name) {
    return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + "</svg>";
  }
  var CANAL_ICON = { "E-mail": "mail", "E-mail interne": "mail", "SMS": "chat", "WhatsApp": "chat", "Chat du site": "chat", "PMS": "db", "Google": "star" };

  /* ---------- Contenu ---------- */
  var LEXIQUE = {
    "PMS": "Le logiciel principal de l'hôtel : réservations, chambres, factures, clients. TriggerFlow se branche dessus.",

    var ns = nextStepIndex();
    if (s === 0) { label = "Commencer"; fn = function () { step(0); }; }
    else if (ns >= 0) { label = "Reprendre : " + ETAPES[ns].name; fn = function () { step(ns); }; }
    else if (!P.demo) { label = "Continuer : la démo"; fn = function () { demo(0); }; }
    else if (st < STAND.length) { label = "Continuer : Sur le stand"; fn = function () { stand(firstUndoneStand()); }; }
    else { label = P.quizBest == null ? "Passer le quiz final" : "Refaire le quiz"; fn = startQuiz; }
    setBar(null, { label: label, fn: fn });
  }

  function step(i) {
    var e = ETAPES[i];
    setTop({ title: "Étape " + (i + 1) + " / " + ETAPES.length, pct: (i / ETAPES.length) * 100, ruler: i });
    var autos = e.autos.map(function (a) {
      var chips = a.canal.map(function (c) { return '<span class="chip">' + icon(CANAL_ICON[c] || "chat") + esc(c) + "</span>"; }).join("");
      return '<div class="auto"><div class="ben">' + rich(a.ben) + (a.option ? ' <span class="tag-option">Option</span>' : "") + "</div>" +
        '<div class="what">' + rich(a.what) + "</div>" +
        '<div class="chips"><span class="chip when">' + icon("clock") + esc(a.when) + "</span>" + chips + "</div></div>";
    }).join("");
    paint(
      '<div class="stack"><p class="eyebrow">' + esc(e.day) + " · " + esc(e.name) + "</p><h2>" + esc(e.title) + "</h2></div>" +
      '<div class="duo">' +
        '<section class="side"><p class="label">' + icon("user") + 'Ce que vit Julie</p><div class="prose">' + para(e.client) + "</div></section>" +
        '<section class="side team"><p class="label">' + icon("bell") + 'En coulisses</p><div class="prose">' + para(e.team) + "</div></section>" +
      "</div>" +
      '<section class="stack"><p class="label">Ce que TriggerFlow fait tout seul</p><div class="autos">' + autos + "</div></section>" +
      '<section class="say"><p class="label">La phrase à dire au salon</p><q>' + esc(e.say) + "</q></section>" +
      '<section class="stack"><p class="label">Les mots à connaître</p><div class="term-chips">' + e.terms.map(function (t) { return termBtn(t); }).join("") + "</div></section>"
    );
    setBar(
      i > 0 ? { label: "Étape précédente", fn: function () { step(i - 1); } } : { label: "Sommaire", fn: home },
      { label: "Vérifier", fn: function () { check(i); } }
    );
  }

  function check(i) {
    var item = ETAPES[i].check;
    var title = "Étape " + (i + 1) + " / " + ETAPES.length + " · vérification";
    setTop({ title: title, pct: ((i + .5) / ETAPES.length) * 100, ruler: i });
    paint('<div class="stack"><p class="eyebrow">Petite vérification</p><p class="question">' + esc(item.q) + "</p></div>" + questionBlock(item));
    var last = i === ETAPES.length - 1;
    var back = { label: "Revoir l'étape", fn: function () { step(i); } };
    var go = { label: last ? "Terminer le séjour" : "Étape suivante", fn: function () { last ? stepsDone() : step(i + 1); }, disabled: true };
    setBar(back, go);
    armQuestion(item, function () {
      P.steps[i] = true; save();
      go.disabled = false;
      setBar(back, go);
      setTop({ title: title, pct: ((i + 1) / ETAPES.length) * 100, ruler: i });
    });
  }

  function stepsDone() {
    setTop({ title: "Le séjour de Julie", pct: 100, ruler: ETAPES.length - 1 });
    paint(
      '<div class="result"><p class="eyebrow">Module 1 terminé</p><h2>Tu connais le séjour de Julie</h2>' +
      '<p class="lead">Six moments, et à chacun, des messages qui partent tout seuls. Voyons maintenant ce que Soufiane et Mounir montrent en démo.</p></div>'
    );
    setBar({ label: "Sommaire", fn: home }, { label: "Ce que montre la démo", fn: function () { demo(0); } });
  }

  function demo(i) {
    var d = DEMO[i];
    var title = "La démo · " + (i + 1) + " / " + DEMO.length;
    setTop({ title: title, pct: ((i + 1) / DEMO.length) * 100 });
    paint(
      '<div class="stack"><p class="eyebrow">Écran ' + (i + 1) + " de la démo</p><h2>" + esc(d.title) + "</h2></div>" +
      '<section class="side"><div class="prose"><p>' + esc(d.body) + "</p></div></section>" +
      '<section class="say"><p class="label">La phrase à retenir</p><q>' + esc(d.say) + "</q></section>"
    );
    var last = i === DEMO.length - 1;
    setBar(
      i > 0 ? { label: "Écran précédent", fn: function () { demo(i - 1); } } : { label: "Sommaire", fn: home },
      { label: last ? "Passer au stand" : "Écran suivant", fn: function () {
        if (!last) { demo(i + 1); return; }
        P.demo = true; save(); stand(firstUndoneStand());
      } }
    );
  }

  function stand(i) {
    var s = STAND[i];
    var title = "Sur le stand · " + (i + 1) + " / " + STAND.length;
    setTop({ title: title, pct: (i / STAND.length) * 100 });
    paint(
      '<p class="eyebrow">Mise en situation ' + (i + 1) + "</p>" +
      '<div class="convo"><div class="who"><span class="avatar" aria-hidden="true">' + esc(s.init) + "</span><span><b>" + esc(s.who) + "</b><small>" + esc(s.role) + "</small></span></div>" +
      '<p class="context">' + esc(s.context) + '</p><div class="bubble">' + esc(s.say) + "</div></div>" +
      '<p class="label">Ta meilleure réponse ?</p>' + questionBlock(s)
    );
    var last = i === STAND.length - 1;
    var back = i > 0 ? { label: "Situation précédente", fn: function () { stand(i - 1); } } : { label: "Sommaire", fn: home };
    var go = { label: last ? "Voir mon bilan" : "Situation suivante", fn: function () { last ? standDone() : stand(i + 1); }, disabled: true };
    setBar(back, go);
    armQuestion(s, function (ok) {
      P.stand[i] = ok; save();
      go.disabled = false;
      setBar(back, go);
      setTop({ title: title, pct: ((i + 1) / STAND.length) * 100 });
    });
  }

  function standDone() {
    var good = STAND.filter(function (_, i) { return P.stand[i] === true; }).length;
    var missed = STAND.map(function (_, i) { return P.stand[i] === true ? null : i; }).filter(function (x) { return x !== null; });
    setTop({ title: "Sur le stand", pct: 100 });
    paint(
      '<div class="result"><p class="eyebrow">Module 2 terminé</p><div class="big">' + good + "<small> / " + STAND.length + "</small></div>" +
      '<p class="lead">' + (good === STAND.length ? "Parfait. Tu sais accrocher, filtrer et passer le relais." : "Les bons réflexes : des questions avant tout, jamais de « oui » ou de « non » au hasard, toujours le relais vers la démo.") + "</p></div>" +
      (missed.length ? '<section class="stack"><p class="label">À rejouer</p><div class="review">' + missed.map(function (i) {
        return '<button type="button" class="btn ghost" data-stand="' + i + '">' + icon("redo") + "<span>" + esc(STAND[i].say) + "</span></button>";
      }).join("") + "</div></section>" : "")
    );
    setBar({ label: "Sommaire", fn: home }, { label: "Quiz final", fn: startQuiz });
  }

  /* Quiz : une question par écran, puis on rejoue les erreurs */
  var Q = null;
  function startQuiz() { Q = { queue: QUIZ.map(function (_, i) { return i; }), pos: 0, firstTry: {}, retry: false }; quiz(); }
  function quiz() {
    var qi = Q.queue[Q.pos], item = QUIZ[qi], total = Q.queue.length;
    var title = (Q.retry ? "Rattrapage · " : "Quiz · ") + (Q.pos + 1) + " / " + total;
    setTop({ title: title, pct: (Q.pos / total) * 100 });
    paint('<div class="stack"><p class="eyebrow">' + (Q.retry ? "On rejoue tes erreurs" : "Question " + (Q.pos + 1)) + '</p><p class="question">' + esc(item.q) + "</p></div>" + questionBlock(item));
    var last = Q.pos === total - 1;
    var back = { label: "Sommaire", fn: home };
    var go = { label: last ? "Voir mon score" : "Question suivante", fn: function () { if (last) quizDone(); else { Q.pos++; quiz(); } }, disabled: true };
    setBar(back, go);
    armQuestion(item, function (ok) {
      if (!Q.retry) Q.firstTry[qi] = ok;
      go.disabled = false;
      setBar(back, go);
      setTop({ title: title, pct: ((Q.pos + 1) / total) * 100 });
    });
  }
  function quizDone() {
    var good = QUIZ.filter(function (_, i) { return Q.firstTry[i] === true; }).length;
    if (!Q.retry) { P.quizBest = Math.max(P.quizBest || 0, good); save(); }
    var missed = QUIZ.map(function (_, i) { return Q.firstTry[i] === true ? null : i; }).filter(function (x) { return x !== null; });
    var msg = good >= Math.ceil(QUIZ.length * .9) ? "Tu es prêt·e pour le salon !" : good >= Math.ceil(QUIZ.length * .6) ? "Pas mal. Rejoue tes erreurs et relis les fiches du salon." : "Refais un tour du séjour de Julie et des fiches, puis retente le quiz.";
    var steps = {};
    missed.forEach(function (i) { if (QUIZ[i].step != null) steps[QUIZ[i].step] = true; });
    setTop({ title: "Quiz final", pct: 100 });
    paint(
      '<div class="result"><p class="eyebrow">' + (Q.retry ? "Rattrapage terminé · score du premier essai" : "Ton score") + '</p><div class="big">' + good + "<small> / " + QUIZ.length + "</small></div>" +
      '<p class="lead">' + msg + "</p></div>" +
      (Object.keys(steps).length ? '<section class="stack"><p class="label">Étapes à revoir</p><div class="review">' + Object.keys(steps).map(function (k) {
        return '<button type="button" class="btn ghost" data-step="' + k + '">' + icon("redo") + "<span>" + esc(ETAPES[k].day + " · " + ETAPES[k].name) + "</span></button>";
      }).join("") + "</div></section>" : "")
    );
    if (missed.length && !Q.retry) {
      var firstTry = Q.firstTry;
      setBar({ label: "Sommaire", fn: home }, { label: "Rejouer mes " + missed.length + " erreur" + (missed.length > 1 ? "s" : ""), fn: function () { Q = { queue: missed, pos: 0, firstTry: firstTry, retry: true }; quiz(); } });
    } else {
      setBar(null, { label: "Retour au sommaire", fn: home, icon: false });
    }
  }

  /* ---------- Fiches du salon : à consulter sur le stand ---------- */
  function fichePage(title, eyebrow, h2, html) {
    setTop({ title: title, pct: 100 });
    paint('<div class="stack"><p class="eyebrow">' + esc(eyebrow) + "</p><h2>" + esc(h2) + "</h2></div>" + html);
    setBar(null, { label: "Retour au sommaire", fn: home, icon: false });
  }

  function role() {
    fichePage("Ton rôle sur le salon", "Equip'Hôtel · 2 au 5 novembre", "Ton rôle sur le salon",
      ROLE.map(function (r) {
        return '<section class="side"><p class="label">' + esc(r.label) + '</p><div class="prose">' + r.body.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div></section>";
      }).join("")
    );
  }

  function profils() {
    fichePage("Qui est en face ?", "Les profils de visiteurs", "Qui est en face ?",
      '<p class="lead">Repère vite à qui tu parles : ton temps va aux hôteliers qui décident.</p>' +
      PROFILS.map(function (p) {
        return '<section class="side profil"><div class="who"><span class="avatar" aria-hidden="true">' + esc(p.init) + "</span><span><b>" + esc(p.who) + '</b><small class="tag">' + esc(p.tag) + "</small></span></div>" +
          '<dl class="facts"><dt>Comment le repérer</dt><dd>' + esc(p.spot) + "</dd><dt>Quoi dire</dt><dd>" + esc(p.say) + "</dd><dt>Quoi faire</dt><dd>" + esc(p.act) + "</dd></dl></section>";
      }).join("")
    );
  }

  function decouverte() {
    fichePage("Poser les bonnes questions", "Avant de présenter quoi que ce soit", "Poser les bonnes questions",
      '<section class="say"><p class="label">La règle</p><q>Ne parle pas en premier. Sans questions, tu vises les yeux fermés : tu risques de parler upsell à quelqu\'un dont le problème, c\'est Booking.</q></section>' +
      '<section class="stack"><p class="label">Les questions de découverte</p><ol class="steps-list">' + DECOUVERTE.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ol></section>" +
      '<section class="side"><p class="label">Amener la démo</p><div class="prose"><p>Quand le besoin est là : « Le mieux, c\'est que Soufiane ou Mounir vous montre en 20 minutes. Maintenant, ou plutôt cet après-midi ? »</p><p>Le ton s\'adapte à la personne : certains tutoient, d\'autres vouvoient, certains sont en costume, d\'autres en survêt.</p></div></section>'
    );
  }

  function faq() {
    fichePage("Questions fréquentes", "Ce qu'on te demandera sur le stand", "Les questions qu'on te posera",
      '<div class="stack"><label class="label" for="faq-q">Chercher</label><input id="faq-q" class="search" type="search" placeholder="Par exemple : Booking, prix, Mews" autocomplete="off"></div>' +
      '<div class="lex" id="faq-list"></div>' +
      '<p class="note">Pas de réponse ici ? Ni oui ni non au hasard : tu passes le relais et tu poses la question dans le groupe WhatsApp.</p>'
    );
    var list = document.getElementById("faq-list");
    function draw(f) {
      var n = f.trim().toLowerCase();
      var items = FAQ.filter(function (x) { return !n || x.q.toLowerCase().indexOf(n) >= 0 || x.a.toLowerCase().indexOf(n) >= 0; });
      list.innerHTML = items.length
        ? items.map(function (x) { return "<details><summary>" + esc(x.q) + "</summary><p>" + esc(x.a) + "</p></details>"; }).join("")
        : '<p class="empty">Aucune réponse ne correspond. Pose la question dans le groupe WhatsApp.</p>';
    }
    document.getElementById("faq-q").addEventListener("input", function (e) { draw(e.target.value); });
    draw("");
  }

  function offre() {
    var rows = OFFRE.map(function (o) {
      return '<div class="price-row"><div><b>' + esc(o.name) + "</b><small>" + esc(o.note) + "</small></div>" +
        '<div class="num-col"><span class="was">' + esc(o.now) + '</span><span class="now">' + esc(o.salon) + "</span></div></div>";
    }).join("");
    fichePage("Prix et offre salon", "Les prix sont publics", "Prix et offre salon",
      '<section class="say"><p class="label">À mettre en avant</p><q>Signez pendant le salon : 10 % de moins sur le tarif 2026, bloqué pendant toute la durée du contrat, et 2 mois offerts.</q></section>' +
      '<section class="stack"><p class="label">Par mois · tarif 2026, puis signé sur le stand</p><div class="prices">' + rows + "</div></section>" +
      '<section class="side"><p class="label">À savoir</p><div class="prose">' +
        "<p><b>Réponse simple :</b> « Autour de 150 € par mois pour l'essentiel. Et si vous signez pendant le salon, c'est 10 % de moins, à vie, plus 2 mois offerts. »</p>" +
        "<p><b>Au 1er janvier 2027</b>, les prix montent : " + OFFRE.map(function (o) { return esc(o.name) + " " + esc(o.next); }).join(", ") + ".</p>" +
        "<p><b>Après le salon :</b> 2 mois offerts pour toute signature jusqu'au 30 novembre, tarif 2026 bloqué pour toute signature avant le 31 décembre. Les 10 % sont réservés au stand.</p>" +
        "<p><b>Sans engagement.</b> Pour un groupe, les 2 mois sont offerts par hôtel. Le tarif bloqué concerne l'abonnement : les crédits SMS, WhatsApp et IA restent au tarif en vigueur.</p>" +
        "<p><b>Formule Découverte :</b> gratuite, sans carte bancaire, pour tester ses premiers scénarios clients. L'offre salon porte sur les formules payantes.</p>" +
        "<p><b>Un groupe de plusieurs hôtels ?</b> « Ça dépend du nombre d'hôtels » : tu passes la main à Soufiane ou Mounir.</p>" +
      "</div></section>"
    );
  }

  function lexique() {
    setTop({ title: "Lexique · " + LEX_KEYS.length + " mots", pct: 100 });
    paint(
      '<div class="stack"><p class="eyebrow">À réviser avant le salon</p><h2>Lexique</h2></div>' +
      '<div class="stack"><label class="label" for="lex-q">Chercher un mot</label><input id="lex-q" class="search" type="search" placeholder="Par exemple : RevPAR" autocomplete="off"></div>' +
      '<div class="lex" id="lex-list"></div>'
    );
    var list = document.getElementById("lex-list");
    var sorted = LEX_KEYS.slice().sort(function (a, b) { return a.localeCompare(b, "fr"); });
    function draw(f) {
      var n = f.trim().toLowerCase();
      var keys = sorted.filter(function (k) { return !n || k.toLowerCase().indexOf(n) >= 0 || LEXIQUE[k].toLowerCase().indexOf(n) >= 0; });
      list.innerHTML = keys.length
        ? keys.map(function (k) { return "<details><summary>" + esc(k) + "</summary><p>" + esc(LEXIQUE[k]) + "</p></details>"; }).join("")
        : '<p class="empty">Aucun mot ne correspond. Essaie un autre terme, ou note-le pour Soufiane.</p>';
    }
    document.getElementById("lex-q").addEventListener("input", function (e) { draw(e.target.value); });
    draw("");
    setBar(null, { label: "Retour au sommaire", fn: home, icon: false });
  }

  /* ---------- Panneau de définition ---------- */
  var lastFocus = null;
  function openSheet(key) {
    lastFocus = document.activeElement;
    $sheet.innerHTML = '<div class="sheet-scrim" data-act="close-sheet"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="grab"></div><h3 id="sheet-t">' + esc(key) + "</h3><p>" + esc(LEXIQUE[key]) + "</p>" +
      '<button type="button" class="btn primary" data-act="close-sheet"><span>J\'ai compris</span></button></div>';
    var btn = $sheet.querySelector(".sheet .btn");
    if (btn) btn.focus();
  }
  function closeSheet(silent) {
    if (!$sheet.innerHTML) return;
    $sheet.innerHTML = "";
    if (!silent && lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }

  /* ---------- Délégation des clics ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-term],[data-act],[data-go],[data-stand],[data-step]");
    if (!t) return;
    if (t.hasAttribute("data-term")) { openSheet(t.getAttribute("data-term")); return; }
    var act = t.getAttribute("data-act");
    if (act === "close-sheet") { closeSheet(); return; }
    if (act === "home") { home(); return; }
    if (act === "back") { if (actions.back) actions.back(); return; }
    if (act === "primary") { if (actions.primary) actions.primary(); return; }
    var go = t.getAttribute("data-go");
    if (go === "steps") { var n = nextStepIndex(); step(n < 0 ? 0 : n); return; }
    if (go === "stand") { stand(countDone(P.stand) >= STAND.length ? 0 : firstUndoneStand()); return; }
    if (go === "quiz") { startQuiz(); return; }
    if (go === "lexique") { lexique(); return; }
    if (go === "demo") { demo(0); return; }
    if (go === "role") { role(); return; }
    if (go === "profils") { profils(); return; }
    if (go === "decouverte") { decouverte(); return; }
    if (go === "faq") { faq(); return; }
    if (go === "offre") { offre(); return; }
    if (t.hasAttribute("data-stand")) { stand(+t.getAttribute("data-stand")); return; }
    if (t.hasAttribute("data-step")) { step(+t.getAttribute("data-step")); return; }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  home();
})();
</script>
</body>
</html>
